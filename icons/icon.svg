<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Cookie base -->
  <circle cx="256" cy="256" r="150" fill="#fef3c7"/>
  <circle cx="256" cy="256" r="150" fill="url(#shine)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#d97706" stroke-width="3" stroke-opacity="0.15"/>

  <!-- Chocolate chips -->
  <g fill="#78350f">
    <circle cx="205" cy="215" r="23"/>
    <circle cx="312" cy="205" r="19"/>
    <circle cx="330" cy="298" r="24"/>
    <circle cx="218" cy="322" r="21"/>
    <circle cx="272" cy="262" r="16"/>
    <circle cx="168" cy="272" r="14"/>
    <circle cx="288" cy="352" r="12"/>
    <circle cx="180" cy="185" r="13"/>
  </g>
</svg>