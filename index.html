<html lang="id">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kue As-Syifa">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<link rel="manifest" href="manifest.json">

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<!-- PERTAHANKAN SVG SYMBOLS DARI FILE LAMA -->
<!-- Copy-paste semua <symbol id="i-xxx">...</symbol> dari index.html lama Anda ke sini -->
<!-- Tanpa SVG symbols, ikon tidak akan muncul -->
</defs></svg>

<div id="app"></div>
<div id="loader" class="loader hide"><div class="spinner"></div></div>
<div id="toasts" class="toasts"></div>
<div id="modals"></div>

<script src="app.js?v=6.1" defer></script>
<script>
// ============================================
//  Service Worker Registration — PWA
// ============================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => {
        console.log('✅ Service Worker terdaftar');
        setInterval(() => reg.update(), 60 * 60 * 1000);
      })
      .catch(err => console.warn('❌ SW gagal:', err));
  });
}

// Deteksi install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (document.getElementById('pwa-install-btn')) return;
  const btn = document.createElement('button');
  btn.id = 'pwa-install-btn';
  btn.textContent = '📲 Install Aplikasi';
  btn.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 20px;background:#f59e0b;color:#fff;border:none;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(245,158,11,.35);cursor:pointer;font-family:inherit;';
  btn.onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    btn.remove();
  };
  document.body.appendChild(btn);
});
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('pwa-install-btn');
  if (btn) btn.remove();
  deferredPrompt = null;
});
</script>
</body>
</html>
