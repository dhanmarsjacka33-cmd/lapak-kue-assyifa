<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => { console.log('✅ SW terdaftar'); setInterval(() => reg.update(), 60 * 60 * 1000); })
      .catch(err => console.warn('❌ SW gagal:', err));
  });
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (document.getElementById('pwa-install-btn')) return;
  const btn = document.createElement('button');
  btn.id = 'pwa-install-btn';
  btn.textContent = '📲 Install';
  btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;padding:10px 16px;background:#f59e0b;color:#fff;border:none;border-radius:24px;font-weight:600;font-size:13px;box-shadow:0 4px 16px rgba(245,158,11,.4);cursor:pointer;font-family:inherit;';
  btn.onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; btn.remove(); };
  document.body.appendChild(btn);
});
window.addEventListener('appinstalled', () => { const b = document.getElementById('pwa-install-btn'); if (b) b.remove(); deferredPrompt = null; });
</script>
